<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROLLER</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>ROLLER</h1>

  <div id="game-shell">
    <canvas id="game" width="800" height="400"></canvas>

    <div id="game-over-screen" class="hidden">
      <h2>Game Over</h2>
      <p id="game-over-score">Current score: 0</p>
      <p>Press R to restart</p>
    </div>
  </div>

  <p id="message">Loading...</p>
  <p id="score">Current: 0   High: 0</p>

  <p class="controls">
    LEFT / RIGHT arrow to roll &nbsp;&middot;&nbsp;
    UP arrow or W to jump &nbsp;&middot;&nbsp;
    SPACE to fire &nbsp;&middot;&nbsp;
    R to restart
  </p>

  <!-- ===================================================================
       THE ORDER OF THESE FILES MATTERS. Each one uses the ones above it.
       If you add a new file, add it to this list too, in the right spot.
       =================================================================== -->
  <script src="js/config.js"></script>
  <script src="js/input.js"></script>
  <script src="js/level.js"></script>
  <script src="js/collide.js"></script>
  <script src="js/player.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
